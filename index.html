
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Automation Demo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;

  <div class="container">

    <button type="button">Login</button>

</html>
